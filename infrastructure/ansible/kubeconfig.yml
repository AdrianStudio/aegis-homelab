- hosts: k3s-01
  tasks:
  - name: Reads the path for the kubeconfig file inside its host
    ansible.builtin.slurp:
      src: /etc/rancher/k3s/k3s.yaml
    register: kubeconfig
    become: true
    no_log: true

  - name: Writes kubeconfig on the target machine
    ansible.builtin.copy:
      content: "{{ kubeconfig.content | b64decode | replace('127.0.0.1', hostvars['k3s-01'].ansible_host)}}"
      dest: ~/.kube/config
      mode: "0600"
    delegate_to: localhost
    no_log: true
