---
- hosts: k3s
  become: true
  tasks:
    - name: Install qemu-guest-agent on all target machines
      ansible.builtin.apt:
        name: qemu-guest-agent
        state: present
        update_cache: true

    - name: Ensure qemu agent is running
      ansible.builtin.systemd_service:
        name: qemu-guest-agent
        state: started
