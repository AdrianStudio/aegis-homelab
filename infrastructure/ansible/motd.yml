# Replaces Ubuntu's default login messages with an AEGIS banner (same style as the Proxmox hosts).
- hosts: k3s
  become: true
  vars:
    motd_width: 46
  tasks:
    - name: Find Ubuntu's default login scripts
      ansible.builtin.find:
        paths: /etc/update-motd.d
        excludes: "01-aegis"
        file_type: any # 50-landscape-sysinfo is a symlink; the default (file) skips it
      register: motd_scripts

    # Not executable = not run at login. A package upgrade can re-enable one; rerunning this playbook fixes it.
    - name: Disable them
      ansible.builtin.file:
        path: "{{ item.path }}"
        mode: "0644"
      loop: "{{ motd_scripts.files }}"
      loop_control:
        label: "{{ item.path | basename }}"

    - name: Stop motd-news from fetching Canonical's ads
      ansible.builtin.lineinfile:
        path: /etc/default/motd-news
        regexp: "^ENABLED="
        line: "ENABLED=0"

    - name: Install the AEGIS banner
      ansible.builtin.template:
        src: templates/aegis-motd.sh.j2
        dest: /etc/update-motd.d/01-aegis
        mode: "0755"
