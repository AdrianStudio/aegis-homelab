# LoadBalancer IP pool and L2 announcements for the LORIANX cluster (Cilium LB IPAM).
# .50-.79 is outside the router's DHCP pool (.128-.254) and reserved for Services of type LoadBalancer.
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: lan
spec:
  blocks:
    - start: 192.168.1.50
      stop: 192.168.1.79
---
# Any node may answer ARP for LoadBalancer IPs on its LAN interface; if it fails, another one takes over.
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: lan
spec:
  interfaces:
    - ^eth0$ # the nodes' only NIC
  loadBalancerIPs: true
