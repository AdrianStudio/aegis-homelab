# Checks that run on every `git commit`.
# Setup (once): pre-commit install
repos:
  - repo: local
    hooks:
      - id: tofu-fmt
        name: tofu fmt
        entry: tofu fmt -check -recursive infrastructure/opentofu
        language: system
        files: \.tf$
        pass_filenames: false

      - id: tofu-validate
        name: tofu validate
        entry: tofu -chdir=infrastructure/opentofu/proxmox validate
        language: system
        files: \.tf$
        pass_filenames: false

      - id: tflint
        name: tflint
        entry: tflint --chdir=infrastructure/opentofu/proxmox
        language: system
        files: \.tf$
        pass_filenames: false

      - id: terraform-docs
        name: terraform-docs (README inputs/outputs)
        entry: terraform-docs markdown table --output-file README.md --output-mode inject infrastructure/opentofu/proxmox
        language: system
        files: \.tf$
        pass_filenames: false
